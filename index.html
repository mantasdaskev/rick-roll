<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>▶</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  #play {
    width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid #fff; background: transparent; cursor: pointer;
    display: grid; place-items: center;
    transition: transform .3s ease, opacity .6s ease, background .3s ease;
  }
  #play:hover { transform: scale(1.08); background: rgba(255,255,255,.08); }
  #play svg { width: 48px; height: 48px; margin-left: 8px; fill: #fff; }
  #play.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 0 16px; }
  #msg {
    color: #fff; font: 500 20px/1.4 system-ui, sans-serif; text-align: center;
    min-height: 1.4em; opacity: 0; transition: opacity .3s ease;
  }
  #msg.on { opacity: 1; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }
  #stage {
    position: fixed; inset: 0; opacity: 0; transform: scale(.96);
    transition: opacity 1.2s ease, transform 1.2s ease;
    pointer-events: none;
  }
  #stage.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  #stage iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="wrap">
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>
  </button>
  <div id="msg"></div>
</div>
<div id="stage"><div id="player"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const VIDEO = 'dQw4w9WgXcQ';
  const fallback = () => { location.href = 'https://www.youtube.com/watch?v=' + VIDEO; };

  const MESSAGES = ['Loading...', 'Almost there...', 'Go?'];
  const msg = document.getElementById('msg');
  let clicks = 0;

  function tease(btn) {
    msg.classList.remove('on');
    setTimeout(() => { msg.textContent = MESSAGES[clicks]; msg.classList.add('on'); clicks++; }, 150);
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
  }

  document.getElementById('play').addEventListener('click', function () {
    if (clicks < MESSAGES.length) return tease(this);
    msg.classList.remove('on');
    this.classList.add('gone');
    const stage = document.getElementById('stage');
    if (!window.YT || !YT.Player) return setTimeout(fallback, 400);
    setTimeout(() => stage.classList.add('show'), 400);
    // If the video isn't actually playing within 5s, go to YouTube directly.
    const watchdog = setTimeout(fallback, 5000);
    new YT.Player('player', {
      videoId: VIDEO,
      host: 'https://www.youtube.com',
      playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, origin: location.origin },
      events: {
        onReady: e => e.target.playVideo(),
        onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) clearTimeout(watchdog); },
        onError: fallback
      }
    });
  });
</script>
</body>
</html>
